workflows:
  ios-app-store:
    name: Facesofnaija App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "FacesofnaijaiOS.xcworkspace"
        XCODE_SCHEME: "FacesofnaijaiOS"
        BUNDLE_ID: "com.facesofnaija.timeline"
        SHARE_EXT_BUNDLE_ID: "com.facesofnaija.timeline.FacesofnaijaShare"
      groups:
        - app_store_credentials
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods Dependencies
        script: |
          pod install --repo-update
      - name: Initialize Keychain
        script: |
          keychain initialize
      - name: Fetch Signing Certificates & Profiles
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$SHARE_EXT_BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add Certificates to Keychain
        script: |
          keychain add-certificates
      - name: Configure Xcode Project Code Signing
        script: |
          xcode-project use-profiles
      - name: Build Production IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
